server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    autoindex off;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Hidden files are never served.
    location ~ /\. {
        return 404;
    }

    # Pages, scripts and styles: the browser must check with the server each
    # time (cheap 304 via ETag), so a deploy is visible immediately even when
    # a file's ?v= tag was not bumped.
    location ~* \.(html|js|css)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Fonts, PDF viewer and manual images rarely change.
    location ~ ^/(fonts|vendor|manual)/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
