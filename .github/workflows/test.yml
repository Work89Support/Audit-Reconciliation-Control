name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # เทสใช้เฉพาะโมดูลในตัวของ Node ไม่มี dependency ภายนอก จึงไม่ต้อง npm install
      - name: Run unit tests
        run: npm test
      - name: Verify clarification send receipts without production writes
        run: node tests/clarification-send-confirmation.test.cjs
      - name: Verify current case counts and persistent read-only account registry
        run: node tests/daily-current-case-summary.test.cjs && node tests/daily-hold-registry.test.cjs && node tests/manual-result-counts.test.cjs
      - name: Verify operational registry roles without expanding finance access
        run: node tests/operational-hold-registry.test.cjs
      - name: Verify clarification request receipt and preserved navigation
        run: npm run test:ui-qa
      - name: Verify all-role evidence checklist
        run: node tests/case-evidence-checklist.test.cjs
      - name: Verify suspended-account hold scope and report distinction
        run: node --test tests/account-review-holds.test.cjs && node tests/continuous-account-review-hold.test.cjs
      - name: Verify AZPAY source time and cross-day display
        run: node tests/azpay-source-cross-day.test.cjs
      - name: Verify queue auto refresh and draft protection
        run: node tests/live-queue-auto.test.cjs && node tests/live-background-update.test.mjs && node tests/audit-review-queue.test.cjs
      - name: Verify read-only emergency source ZIP
        run: npm run test:source-archive
      - name: Verify read-only scoped finance reporting
        run: node tests/finance-report.test.cjs && node tests/finance-actions.test.cjs && node tests/finance-bo-analysis.test.cjs && node tests/finance-bo-source.test.cjs
      - name: Verify cross-day image review
        run: |
          node tests/cross-day-image-review.test.cjs
          node tests/cross-day-bulk-head.test.cjs
          node tests/cross-day-workbench.test.cjs
          npm install --prefix "$RUNNER_TEMP/image-review-db" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
          node tests/finance-report-db.test.mjs "$RUNNER_TEMP/image-review-db/node_modules/@electric-sql/pglite/dist/index.js"
          node tests/manual-primary.test.cjs
          node tests/cross-day-rule-warning-view.test.cjs
          node tests/manual-primary-case-handoff.test.cjs
          node tests/manual-primary-db.test.mjs "$RUNNER_TEMP/image-review-db/node_modules/@electric-sql/pglite/dist/index.js"
          node tests/primary-bo-timing-db.test.mjs "$RUNNER_TEMP/image-review-db/node_modules/@electric-sql/pglite/dist/index.js"
          node tests/primary-waiting-bo-timing-db.test.mjs "$RUNNER_TEMP/image-review-db/node_modules/@electric-sql/pglite/dist/index.js"
          node tests/manual-cross-day-source-parity-db.test.mjs "$RUNNER_TEMP/image-review-db/node_modules/@electric-sql/pglite/dist/index.js"
          node tests/worker-failure-context.test.cjs
          node tests/fr8-staged-report-repair-db.test.mjs "$RUNNER_TEMP/image-review-db/node_modules/@electric-sql/pglite/dist/index.js"
          node tests/all-company-primary-handoff-db.test.mjs "$RUNNER_TEMP/image-review-db/node_modules/@electric-sql/pglite/dist/index.js"
          node tests/manual-next-case-transport.test.mjs
          node tests/clarify-open-refresh-race.test.cjs
          node tests/clarify-company-navigation.test.cjs
          node tests/manual-primary-scoped-queue-db.test.mjs "$RUNNER_TEMP/image-review-db/node_modules/@electric-sql/pglite/dist/index.js"
          node tests/clarification-return-ui.test.cjs
          node tests/clarification-return-db.test.mjs "$RUNNER_TEMP/image-review-db/node_modules/@electric-sql/pglite/dist/index.js"
          node tests/pending-document-closure-ui.test.cjs
          node tests/pending-document-closure-db.test.mjs "$RUNNER_TEMP/image-review-db/node_modules/@electric-sql/pglite/dist/index.js"
          node tests/selected-file-primary-case-guard.test.mjs "$RUNNER_TEMP/image-review-db/node_modules/@electric-sql/pglite/dist/index.js"
          node tests/account-review-holds-db.test.mjs "$RUNNER_TEMP/image-review-db/node_modules/@electric-sql/pglite/dist/index.js"
          node tests/finance-bo-source-db.test.mjs "$RUNNER_TEMP/image-review-db/node_modules/@electric-sql/pglite/dist/index.js"
          node tests/finance-actions-db.test.mjs "$RUNNER_TEMP/image-review-db/node_modules/@electric-sql/pglite/dist/index.js"
          node tests/cross-day-image-db.test.mjs "$RUNNER_TEMP/image-review-db/node_modules/@electric-sql/pglite/dist/index.js"
          node tests/attachment-register-db.test.mjs "$RUNNER_TEMP/image-review-db/node_modules/@electric-sql/pglite/dist/index.js"
          node tests/waiting-evidence-lookup-db.test.mjs "$RUNNER_TEMP/image-review-db/node_modules/@electric-sql/pglite/dist/index.js"
          node tests/clarification-submit-flow-db.test.mjs "$RUNNER_TEMP/image-review-db/node_modules/@electric-sql/pglite/dist/index.js"
          node tests/manual-pair-scoped-readiness.test.mjs "$RUNNER_TEMP/image-review-db/node_modules/@electric-sql/pglite/dist/index.js"
          npm run test:attachments
      - name: Verify authentication outage recovery
        run: node tests/auth-connecting-gate.test.mjs && node tests/auth-access-outage.test.mjs && node tests/auth-refresh-backoff.test.mjs
      - name: Verify admin email-password provisioning and first-login isolation
        run: |
          node tests/password-accounts.test.cjs
          node tests/password-accounts-db.test.mjs "$RUNNER_TEMP/image-review-db/node_modules/@electric-sql/pglite/dist/index.js"
      - name: Verify confirmed damage and PM payout guards
        run: node tests/damage-save.test.mjs && node tests/damage-summary.test.mjs && node tests/damage-pagination.test.mjs && node tests/damage-view.test.mjs && node tests/pm-partial-payout.test.mjs

