<!doctype html><html lang="th"><meta charset="utf-8"><title>ทดสอบเปิดเคสทุกบริษัท — ข้อมูลจำลอง</title>
<link rel="stylesheet" href="../styles.css"><style>body{padding:28px;background:#edf4fc;color:#16334d;font-family:system-ui}main{max-width:1000px;margin:auto;background:white;padding:28px;border-radius:20px}button,select{padding:12px;margin:6px}#result{white-space:pre-wrap;padding:18px;background:#e9f6ee}dialog{max-width:800px}table{width:100%}td,th{text-align:left;padding:10px}</style>
<main><h1>ทดสอบเปิดเคสต่อ · ทุกบริษัท</h1><p role="note">ข้อมูลจำลองเท่านั้น · ไม่มีการเชื่อม Supabase ไม่สร้างเคสหรือเปลี่ยนข้อมูลจริง</p>
<label>บริษัท <select id="company"><option>3XB</option><option>AT4</option><option>FR8</option><option>MC8</option><option>MR9</option><option>PS8</option><option>SK8</option><option>UFABET7M</option><option>UR9</option></select></label>
<button id="review">ทบทวนผลรันมือ</button><button id="system">ใช้ผลรันระบบจำลองที่บันทึกเคสแล้ว</button><button id="replay">ทดสอบคำขอซ้ำ</button><p id="result" role="status">ยังไม่ได้ทดสอบ</p><section id="cases"></section></main>
<script src="../audit-display.js"></script><script src="../account-recheck.js"></script><script src="../manual-primary.js"></script>
<script>
const result=document.querySelector('#result'),cases=document.querySelector('#cases'),sets=new Map();
const company=()=>document.querySelector('#company').value;
const draw=(mode,replay=false)=>{const c=company();result.textContent=`${c} · 15 ต.ค. 2026 · ${mode}\nเคสพร้อมดำเนินการ 3 เคส · รอตรวจ 2 · รอข้ามวัน 1\nรหัสไม่ซ้ำ 3 · เคสประวัติเดิมคงอยู่ · เปลี่ยนยอด 0 · ปิดเคส 0${replay?'\nคำขอซ้ำ: สร้างเพิ่ม 0 เคส':''}`;cases.innerHTML='<h2>เคสจำลองที่พร้อมดำเนินการ</h2>'+[1,2,3].map(n=>`<p>${c}-TEST-${n} · ${n===3?'รอข้ามวัน':'รอตรวจ'} <button data-open="${n}">เปิดรายละเอียดเคส ${n}</button></p>`).join('');cases.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const d=document.createElement('dialog');d.innerHTML=`<h2>${c}-TEST-${b.dataset.open}</h2><p>เปิดรายละเอียดได้ · ยังไม่ปิดเคส · หลักฐานและผลตรวจรอผู้มีสิทธิ์ดำเนินการ</p><button>กลับรายการ</button>`;d.querySelector('button').onclick=()=>d.remove();document.body.append(d);d.showModal();});};
document.querySelector('#review').onclick=()=>ManualPrimary.open('synthetic-'+company(),{actor:()=> 'qa-lead',role:()=> 'lead',withCases:true,
preview:async()=>({company:company(),date:'2026-10-15',account:'ALL',direction:'all',allowed:true,already_applied:false,file_count:2,token:'synthetic',before:{stm_count:0,bo_count:3,matched:0,exception_count:3},after:{stm_count:0,bo_count:3,matched:0,exception_count:3}}),
accept:async()=>{const c=company(),replay=sets.has(c);sets.set(c,true);return {id:'qa-'+c,case_set:{case_count:3,created:replay?0:3},cases_ready:true};},onAccepted:()=>draw('รันมือ: รับรองผลหลักและเปิดชุดเคสในคำขอเดียว')});
document.querySelector('#system').onclick=()=>draw('รันระบบ: ใช้เคสที่บันทึกไว้ ไม่สร้างชุดซ้ำ');
document.querySelector('#replay').onclick=()=>{if(!sets.has(company())){result.textContent='ต้องยืนยันผลจำลองก่อน';return;}draw('รันมือ: คำขอเดิม',true);};
</script></html>
