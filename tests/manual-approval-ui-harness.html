 {id:'demo-2',bo_case_id:'case-2',stm_case_id:'case-3',bo_company:'FR8',stm_company:'FR8',difference:.02,reason:'ยอดต่างเล็กน้อย / การปัดเศษ',submitted_at:'05/10/2026 13:10',submitted_by:'employee',status:'pending'},
 {id:'demo-own',bo_case_id:'case-4',stm_case_id:'case-4',bo_company:'MC8',stm_company:'MC8',difference:1,reason:'คำขอที่หัวหน้าส่งเอง',submitted_at:'05/10/2026 13:20',submitted_by:'lead',status:'pending'}];
