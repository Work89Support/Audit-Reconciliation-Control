<!doctype html><html lang="th"><meta charset="utf-8"><title>ทดสอบเคสข้ามวัน — ข้อมูลจำลองเท่านั้น</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../mc8-sheets.css">
<body><main style="padding:24px"><h1>ทดสอบปุ่มข้ามวัน — ข้อมูลจำลองเท่านั้น</h1><p>ไม่มีการเชื่อมฐานข้อมูล ไม่มีการส่งคำขอหรือแก้ไขข้อมูลจริง</p>
<label>บริษัททดสอบ <select id="company"></select></label><p id="result" role="status"></p><section id="test"></section></main>
<script src="../audit-visible-policy.js"></script><script src="../review-overview.js"></script>
<script>
const companies=['3XB','AT4','FR8','MC8','MR9','PS8','SK8','UFABET7M','UR9'];
const select=document.querySelector('#company');for(const c of companies)select.add(new Option(c,c));select.value='PS8';
function start(){const company=select.value;ReviewOverview.mount(document.querySelector('#test'),{company,date:'2026-10-16',load:async()=>({complete:true,confirmations:[],run:{matched:0,jobStatus:'completed',summary:{}},cases:[1,2].map(n=>({id:'fixture-'+n,code:company+'-TEST-'+n,company,business_date:'2026-10-16',status:'pending_next_day',ex_type:'cross_day',direction:n===1?'ถอน':'ฝาก',account:'SCB-TEST',system_amount:100*n,bank_amount:null,customer_details:{}}))}),onCompany(){},onCase(row,{action}){document.querySelector('#result').textContent='เปิดตรวจรายละเอียด '+row.code+' · '+action+' · ไม่มีการบันทึก';},onBatchStatus(){throw Error('Fixture forbids writes');}});}
select.onchange=start;start();
</script></body></html>
