<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ทดสอบอัปไฟล์และกู้คำขอเดิม</title><link rel="stylesheet" href="../styles.css"><body style="padding:28px;background:#eef4fa"><main class="panel" style="max-width:900px;margin:auto;padding:28px"><h1>แนบหลักฐาน · ทดสอบ timeout และบันทึกต่อ</h1><p>ใช้ฟังก์ชันอัปโหลดจริงจาก supabase.js กับการเชื่อมต่อจำลอง<br>ไม่มีไฟล์ลูกค้า ไม่มีการเขียนระบบจริง</p><button class="primary-button" id="upload" disabled>1. แนบไฟล์ทดสอบ (จำลองฐานข้อมูล timeout)</button><button class="ghost-button" id="resume" disabled>2. ตรวจ / บันทึกต่อโดยไม่แนบซ้ำ</button><p id="status" role="status">กำลังโหลดโค้ด…</p><table><tbody><tr><th>ส่งไฟล์เข้า Storage</th><td id="uploads">0 ครั้ง</td></tr><tr><th>รหัสคำขอเดิม</th><td id="receipt">—</td></tr><tr><th>ทะเบียนหลักฐาน</th><td id="stored">ยังไม่ยืนยัน</td></tr></tbody></table><pre id="log" style="white-space:pre-wrap"></pre></main><script>
(async()=>{
const $=s=>document.querySelector(s),source=await (await fetch('../supabase.js')).text();let count=0,broken=true,receipt=null;const rows=new Map();
const api=new Function('req','json','post','signedUrl','signedIn','authUser','cfg',source.slice(source.indexOf('const pendingEvidenceUploads = new Map()'),source.indexOf('async function submitClarification(',source.indexOf('const pendingEvidenceUploads = new Map()')))+';return {uploadCaseEvidence,resumeCaseEvidence,pendingCaseEvidence};')(
async()=>{count++;$('#uploads').textContent=count+' ครั้ง';},async path=>{if(path.startsWith('/rest/v1/exceptions?'))return [{id:'test-case',status:'open'}];if(broken)throw Error('database timed out (จำลอง)');const id=decodeURIComponent(path.match(/\?id=eq\.([^&]+)/)[1]);return rows.has(id)?[rows.get(id)]:[];},async(_,body)=>{if(broken)throw Error('database timed out (จำลอง)');rows.set(body[0].id,body[0]);return body;},async()=>{throw Error('not needed');},()=>true,()=>({id:'test-assistant'}),()=>({bucket:'test-only'}));
$('#status').textContent='พร้อมทดสอบ · ไม่เชื่อมต่อฐานข้อมูลจริง';$('#upload').disabled=false;
$('#upload').onclick=async()=>{$('#upload').disabled=true;try{await api.uploadCaseEvidence('test-case',new File(['synthetic audit evidence'], 'TEST_evidence.txt',{type:'text/plain'}));}catch(error){receipt=api.pendingCaseEvidence('test-case')[0];$('#receipt').textContent=receipt.id;$('#status').textContent='Storage ยืนยันแล้ว แต่ทะเบียน timeout — เก็บคำขอเดิมไว้';$('#log').textContent=error.message;$('#resume').disabled=false;}};
$('#resume').onclick=async()=>{broken=false;$('#resume').disabled=true;const saved=await api.resumeCaseEvidence(receipt.id);$('#stored').textContent='ยืนยันสำเร็จ: '+saved.file_name;$('#status').textContent='บันทึกต่อสำเร็จ · รหัสเดิม · ส่งไฟล์เพียง 1 ครั้ง · ไม่ออกจากหน้า';$('#log').textContent='PASS: '+(saved.id===receipt.id&&count===1&&api.pendingCaseEvidence('test-case').length===0?'รหัสเดิม / ไม่อัปซ้ำ / ไม่มีคำขอค้าง':'FAIL');};
})();</script></body></html>
