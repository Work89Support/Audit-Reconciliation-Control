<!doctype html><html lang="th"><meta charset="utf-8"><title>ตรวจรายเดือนแบบเอกสาร — ข้อมูลจำลอง</title>
<link rel="stylesheet" href="../fonts/kanit.css"><link rel="stylesheet" href="../monthly-audit.css">
<style>body{font:18px Kanit;background:#edf4fb;color:#12203a;margin:0}header{background:#103f71;color:white;padding:20px}main{max-width:1140px;margin:auto;padding:20px}.panel{margin-bottom:18px}dialog{border:1px solid #abc;border-radius:14px;max-width:700px}dialog::backdrop{background:#1238}</style>
<header><h1>สุ่มตรวจรายเดือน แบบเอกสารตรวจ</h1><p>หัวหน้า TEST (จำลอง) · ไม่เชื่อมฐานข้อมูลจริง ไม่เปลี่ยนยอดหรือเคสจริง</p></header><main><div id="host" class="feature-workspace"></div></main><dialog id="proof"><h2>หลักฐานจำลอง อ่านอย่างเดียว</h2><p id="proofText"></p><p>ตัวอย่างตรวจยอดและเลขอ้างอิงตรงกับรายการ โดยคงต้นฉบับและประวัติเดิม</p><button id="closeProof">ปิดตัวอย่าง</button></dialog>
<script src="../audit-display.js"></script><script src="../monthly-audit.js"></script><script>
const set={id:'test-set',company:'TEST',month:'2026-10-01',requested_count:3,selected_count:3,available_count:30,created_at:'2026-10-13T10:00:00Z',reviewed_count:1};
const sources=[{id:'file-bo',file_name:'TEST_BO_2026-10-12.xlsx',storage_path:'mock-only/bo'},{id:'file-pm',file_name:'TEST_PM_2026-10-12.csv',storage_path:'mock-only/pm'}];
const snap=(row,amount,kind)=>({account:'AUTOPEER',direction:'deposit',kind,boAmount:amount,stmAmount:amount,rule:'ยอดและเลขอ้างอิงตรง 1:1',bo:{fileId:'file-bo',row,date:'2026-10-12',sec:43200,raw:'BO REF-TEST-'+row+' ยอด '+amount},stm:{fileId:'file-pm',row:row+10,date:'2026-10-12',sec:43180,raw:'PM REF-TEST-'+row+' ยอด '+amount}});
const record={id:'case-closed',code:'EX-TEST-02',company:'TEST',business_date:'2026-10-12',occurred_at:'12:00:00',status:'closed',auto_closed:false,bank_amount:500,system_amount:500,approved_at:'2026-10-13T09:00:00Z',closure_rule:'head-document',resolution_note:'ตรวจ BO และ PM พร้อมหลักฐานรายการตรงกัน ไม่เกิดความเสียหาย'};
const items=[{id:'item-1',ordinal:1,snapshot:snap(1,100,'matched'),exception_id:null,assessment:'passed',note:'ตรวจผลและต้นทางตรงกันแล้ว',reviewed_by:'test-head'},
 {id:'item-2',ordinal:2,snapshot:{...snap(2,500,'exception'),result:record},exception_id:record.id,assessment:'pending',note:''},
 {id:'item-3',ordinal:3,snapshot:snap(3,300,'waiting_source'),exception_id:null,assessment:'needs_evidence',note:'ยังไม่มีต้นทางอีกฝั่ง ต้องตรวจเพิ่มเติม',reviewed_by:'test-head'}].map(x=>({...x,business_date:'2026-10-12',run_id:'test-run',sources,assigned_to:'test-head',revision:1,can_review:true,evidence:[],history:[],reviewed_at:'2026-10-13T10:00:00Z'}));
const opts={actor:()=> 'test-head',role:()=> 'lead',today:'2026-10-13',month:'2026-10',load:async()=>({companies:['TEST'],sets:[set]}),detail:async()=>({set,items,reviewers:[{id:'test-head',name:'หัวหน้า TEST'}]}),create:async()=>{throw Error('ไม่สร้างชุดจริง')},assign:async()=>{throw Error('ไม่เปลี่ยนผู้ตรวจจริง')},upload:async()=>{throw Error('ไม่อัปโหลดจริง')},
 review:async id=>({item_id:id,company:'TEST',business_date:'2026-10-12',run_id:'test-run',checked_at:'2026-10-13T10:30:00Z',lineage_status:id==='item-2'?'cases_found':id==='item-1'?'no_case_at_sampling_run':'no_linked_case_at_sampling_run',cases:id==='item-2'?[{record,closed_by_name:'หัวหน้า TEST',closures:[{status:'approved',requested_name:'Audit TEST',decided_name:'หัวหน้า TEST',requested_at:'2026-10-13T08:00:00Z',decided_at:'2026-10-13T09:00:00Z',audit_reason:'ตรวจไฟล์ต้นทางและหลักฐานแล้ว ยอดตรง ไม่มีความเสียหาย',decision_note:'หัวหน้าทบทวนข้อมูลครบแล้ว ยืนยันผล 0 บาท'}],evidence:[{file_name:'TEST_CASE_PROOF.pdf',storage_path:'mock-only/proof'}],documents:[],history:[]}]:[]}),
 save:async b=>{const x=items.find(x=>x.id===b.p_item);x.assessment=b.p_assessment;x.note=b.p_note;x.reviewed_by='test-head';x.revision++;x.history.push({actor_name:'หัวหน้า TEST',action:'assessment',created_at:'2026-10-13T10:30:00Z',detail:{assessment:b.p_assessment,note:b.p_note}});set.reviewed_count=items.filter(x=>x.assessment!=='pending').length;},preview:f=>{document.querySelector('#proofText').textContent=f.file_name;document.querySelector('#proof').showModal();}};
document.querySelector('#closeProof').onclick=()=>document.querySelector('#proof').close();MonthlyAudit.mount(document.querySelector('#host'),opts);
</script></html>
