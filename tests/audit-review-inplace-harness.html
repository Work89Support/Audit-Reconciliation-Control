<!doctype html><html lang="th"><meta charset="utf-8"><title>ทดสอบคิว Audit แบบไม่รีหน้า</title><link rel="stylesheet" href="../fonts/kanit.css"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../audit-review.css"><body style="padding:24px;background:#edf4fc"><h1>ทดสอบจำลอง คิว Audit รอตรวจ</h1><p>ไม่มีการอนุมัติหรือปิดเคสจริง ตัวกรอง 9 บริษัท และอัปเดตเฉพาะการ์ด</p><p id="testResult" role="status">พร้อมทดสอบ</p><button id="simulateSaved" class="primary-button">จำลองผลบันทึกสำเร็จ EX-TEST-1</button> <button id="simulatePoll" class="ghost-button">จำลองอัปเดตข้อมูลเดิม</button><div id="viewRoot" style="margin-top:16px"></div><script src="../audit-review.js"></script><script>
document.querySelector('#simulateSaved').style.cssText='position:sticky;top:12px;z-index:2';
document.querySelector('#simulatePoll').style.cssText='position:sticky;top:12px;z-index:2';
const companies=['3XB','AT4','FR8','MC8','MR9','PS8','SK8','UFABET7M','UR9'];
const filters={from:'2026-10-14',to:'2026-10-14',company:'ALL',direction:'ALL'};
let exceptions=companies.flatMap((company,index)=>Array.from({length:3},(_,n)=>({id:index===0?'EX-TEST-'+(n+1):company+'-TEST-'+(n+1),company,date:'2026-10-14',direction:'ฝาก',status:'answered',systemAmount:100,bankAmount:100,responseText:'คำตอบและหลักฐานจำลอง ไม่ใช่ข้อมูลลูกค้าจริง',hasEvidence:true})));
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const root=document.querySelector('#viewRoot');let reads=0;
const ctx={get exceptions(){return exceptions;},filters,companies,canAccessCompany:()=>true,h,money:s=>Number(s).toFixed(2),caseLabel:e=>e.company+' '+e.id,openException:id=>document.querySelector('#testResult').textContent='เปิดอ่าน '+id,toast:alert,openOverview:()=>{},isReady:()=>true,isActive:()=>true,refresh:async()=>{reads++;},selectCompany:async company=>{filters.company=company;reads++;}};
AuditReview.mount(root,ctx);
document.querySelector('#simulatePoll').onclick=()=>{const before=root.querySelector('[data-audit-key="EX-TEST-2"]'),companySelect=root.querySelector('[data-audit-company]'),scroll=window.scrollY;const start=performance.now();root.auditQueueUpdateInPlace();const ms=performance.now()-start;document.querySelector('#testResult').textContent=`ข้อมูลเดิม: การ์ดเดิม ${before===root.querySelector('[data-audit-key="EX-TEST-2"]')} ตัวกรองเดิม ${companySelect===root.querySelector('[data-audit-company]')} เลื่อนเดิม ${scroll===window.scrollY} ใช้เวลา ${ms.toFixed(1)} ms เรียกอ่าน ${reads} ครั้ง ไม่มีคำสั่งเขียน`;};
document.querySelector('#simulateSaved').onclick=()=>{const before=root.querySelector('[data-audit-key="EX-TEST-2"]'),select=root.querySelector('[data-audit-company]'),scroll=window.scrollY;exceptions=exceptions.map(e=>e.id==='EX-TEST-1'?{...e,status:'closed'}:e);root.auditQueueUpdateInPlace();document.querySelector('#testResult').textContent=`ผลจำลอง: EX-TEST-1 ออกจากคิว ${!root.querySelector('[data-audit-key="EX-TEST-1"]')} การ์ดถัดไปเดิม ${before===root.querySelector('[data-audit-key="EX-TEST-2"]')} ตัวกรองเดิม ${select===root.querySelector('[data-audit-company]')} เลื่อนเดิม ${scroll===window.scrollY} บริษัท ${filters.company} ไม่มีคำสั่งเขียนข้อมูลจริง`;};
</script></body></html>
