<!doctype html><html lang="th"><meta charset="utf-8"><title>ทดสอบสุ่มตรวจและสิทธิ์หัวหน้า — ข้อมูลจำลอง</title>
<link rel="stylesheet" href="../fonts/kanit.css"><link rel="stylesheet" href="../monthly-audit.css">
<style>body{font-family:Kanit,sans-serif;margin:0;background:#edf3f8;color:#223c53}header{background:#103f71;color:white;padding:18px 28px}nav{display:flex;gap:14px;padding:18px 28px}nav button{padding:12px 18px;font:inherit;border:1px solid #bbcede;border-radius:10px;background:white}main{max-width:1140px;margin:0 auto;padding:20px}header small{display:block;color:#d6e8f9}</style>
<header><h1>Audit AI · ทดสอบฟีเจอร์ใหม่</h1><small>ข้อมูลจำลอง TEST เท่านั้น · ไม่เชื่อมฐานข้อมูลจริง · ไม่เปลี่ยนผู้ใช้ ยอด หรือเคสจริง</small></header>
<nav><button id="monthly">สุ่มตรวจรายเดือน</button><button id="users">จัดการผู้ใช้ในขอบเขตหัวหน้า</button><button id="empty">หัวหน้าที่ยังไม่มีขอบเขต</button></nav><main><div id="host" class="feature-workspace"></div></main>
<script src="../monthly-audit.js"></script><script src="../scoped-user-management.js"></script><script>
const actor=()=> 'dummy-lead',role=()=> 'lead',host=document.querySelector('#host');
const key='monthly-audit-fixture-v1';let sets=JSON.parse(sessionStorage.getItem(key)||'[]');
const items=()=>[{id:'dummy-item-1',ordinal:1,business_date:'2026-09-15',snapshot:{account:'บัญชีทดสอบ A',direction:'ฝาก',kind:'matched',boAmount:100,stmAmount:100,bo:{fileId:'dummy-file',row:1}},assigned_to:'dummy-reviewer',assessment:'pending',note:'',revision:1,can_review:true,sources:[],evidence:[],history:[]},{id:'dummy-item-2',ordinal:2,business_date:'2026-09-15',snapshot:{account:'บัญชีทดสอบ A',direction:'ฝาก',kind:'matched',boAmount:100,stmAmount:100,bo:{fileId:'dummy-file',row:2}},assigned_to:null,assessment:'pending',note:'',revision:1,can_review:true,sources:[],evidence:[],history:[]}];
let detailItems=items();
function monthly(){MonthlyAudit.mount(host,{actor,role,today:'2026-10-13',load:async month=>({companies:['TEST','TEST-B'],sets:sets.filter(s=>s.month===month)}),create:async b=>{let s=sets.find(s=>s.month===b.p_month&&s.company===b.p_company);if(s)return s;s={id:'dummy-set-'+b.p_company,month:b.p_month,company:b.p_company,requested_count:b.p_count,available_count:2,selected_count:Math.min(2,b.p_count),created_at:'2026-10-13 10:00 ข้อมูลจำลอง',reviewed_count:0};sets.push(s);sessionStorage.setItem(key,JSON.stringify(sets));return s;},detail:async id=>({set:sets.find(s=>s.id===id),reviewers:[{id:'dummy-reviewer',name:'ผู้ตรวจ TEST (จำลอง)'}],items:detailItems}),assign:async b=>{const i=detailItems.find(i=>i.id===b.p_item);i.assigned_to=b.p_reviewer;i.revision++;i.history.push({actor_name:'หัวหน้า TEST (จำลอง)',action:'assign',created_at:'ทดสอบ',detail:{reviewer:b.p_reviewer}});},save:async b=>{const i=detailItems.find(i=>i.id===b.p_item);i.assessment=b.p_assessment;i.note=b.p_note;i.revision++;i.history.push({actor_name:'ผู้ตรวจ TEST (จำลอง)',action:'assessment',created_at:'ทดสอบ',detail:{assessment:b.p_assessment,note:b.p_note}});},upload:async()=>{throw Error('ภาพทดสอบนี้ไม่อัปโหลดไฟล์จริง');},preview:()=>{}});}
const userContext={companies:['TEST'],users:[{user_id:'dummy-audit',email:'dummy@example.invalid',full_name:'ผู้ตรวจ TEST (จำลอง)',role:'monitor',active:true,companies:['TEST'],revision:'dummy-revision'}]};
function users(empty=false){ScopedUserManagement.mount(host,{actor,role,load:async()=>empty?{companies:[],users:[]}:userContext,update:async()=>{throw Error('ทดสอบเท่านั้น — ไม่บันทึกผู้ใช้จริง');},create:async()=>{throw Error('ทดสอบเท่านั้น — ไม่ส่งคำเชิญจริง');}});}
document.querySelector('#monthly').onclick=monthly;document.querySelector('#users').onclick=()=>users();document.querySelector('#empty').onclick=()=>users(true);monthly();
</script></html>
