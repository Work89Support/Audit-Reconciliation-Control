<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA finance · synthetic only</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../finance-executive.css"><body style="padding:20px;background:#eff5fb"><h1>QA ข้อมูลจำลองเท่านั้น · ไม่เชื่อมระบบจริง</h1><div id="qa-actions"><button id="qa-staff">ทดสอบ Audit ไม่มีสิทธิ์</button><button id="qa-revoke">ถอนบริษัท MR9 ในข้อมูลจำลอง</button></div><main id="qa-root"></main><script src="../finance-report.js"></script><script src="../finance-executive.js"></script><script>
let scope=['MC8','MR9'],role='lead';const saved=[];
const companies=async()=>[...scope];

const bo=async(company,from,to)=>({company,from,to,days:FinanceReport.dates(from,to).map(date=>({company,date,complete:true,deposit:100.68,withdraw:50,count:2,deposits:1,withdrawals:1,expected:2,reason:'QA synthetic coverage',run_id:'QA-run',channels:[{account:'AZPAY',amount:100.68,count:1}],hours:[{hour:12,count:2}]}))});
const start=()=>FinanceExecutive.mount(document.querySelector('#qa-root'),{role:()=>role,actor:()=> 'qa-user',active:()=>true,today:'2026-10-15',context:companies,cases,bo,formatTime:v=>String(v||'—'),saveBlob:(blob,name)=>{saved.push({name,size:blob.size});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.textContent='ดาวน์โหลด QA '+name;document.querySelector('#qa-actions').appendChild(a);a.click();}});
document.querySelector('#qa-staff').onclick=()=>{document.querySelector('#qa-root').financeDispose?.();role='monitor';start();};document.querySelector('#qa-revoke').onclick=()=>{scope=['MC8'];window.dispatchEvent(new Event('focus'));};start();
</script></body></html>
