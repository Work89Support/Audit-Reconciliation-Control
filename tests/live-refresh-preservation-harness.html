<!doctype html><html lang="th"><meta charset="utf-8"><title>ทดสอบจำลองการคงหน้างาน</title><link rel="stylesheet" href="../fonts/kanit.css"><link rel="stylesheet" href="../styles.css">
<style>body{padding:32px;background:#eff5fb}main{max-width:1000px;margin:auto}button{margin:8px}textarea{display:block;width:100%;min-height:110px}#accessWaitNotice{position:sticky;top:0;z-index:1000}#drawer{position:static;width:100%;transform:none;box-shadow:none;padding:20px}.proof{white-space:pre-wrap;color:#155e37}</style>
<h1>ทดสอบจำลอง · ไม่เชื่อมฐานข้อมูลจริง</h1><p>ใช้ฟังก์ชันตรวจสิทธิ์และอัปเดตหน้ารายการจาก app.js จริง · ไม่มีคำขอบันทึก</p>
<button id="slow">จำลองตรวจสิทธิ์ช้า</button><button id="recover">จำลองเชื่อมต่อกลับ</button><button id="draft">เปิดร่างและรับข้อมูลใหม่</button><button id="finish">กลับรายการ / ใช้ข้อมูลใหม่</button><p id="proof" class="proof"></p>
<section id="connectionGate" hidden><p id="connectionMessage"></p><button id="accessCheckRetry"></button></section><section id="loginGate" hidden><form id="loginForm"></form><form id="resetForm"></form><p id="loginError"></p></section>
<main id="appShell"><section class="panel"><h2>งานชี้แจงแยกตามบริษัท</h2><p>ตัวกรอง: 15 ต.ค. 2026 · FR8 · ฝากและถอน</p><div id="viewRoot"></div></section><section class="panel" id="drawer" hidden><h2>ร่างที่ยังไม่บันทึก</h2><textarea id="responseText"></textarea><p>ยังไม่มีการส่งคำขอหรือเปลี่ยนข้อมูล</p></section></main><div id="modal" hidden></div>
<script>
(async()=>{
 const src=await(await fetch('../app.js')).text(),$=s=>document.querySelector(s);
 const state={dataset:'production',route:'clarify',access:{loaded:true,email:'qa@example.invalid',role:'admin',companies:['FR8']}};
 let transient=false,rows=3,paints=0,prepared=0;
 const Sb={signedIn:()=>true,authUser:()=>({email:'qa@example.invalid'}),passwordChangeRequired:async()=>false,signOut(){throw Error('Unexpected sign out')}};
 const gate=new Function('$',src.slice(src.indexOf('function showLoginGate('),src.indexOf('function render()'))+';return showConnectingGate;')($);
 const entry=new Function('state','Sb','$','showConnectingGate','prepareProductionData','applyAuthenticatedRole',src.slice(src.indexOf('async function enterProductionApp()'),src.indexOf('async function boot()'))+';return enterProductionApp;')(state,Sb,$,gate,()=>prepared++,async()=>{if(transient)throw Error('Supabase ใช้เวลาตอบกลับนานเกิน 30 วินาที (จำลอง)')});
 const liveOverviewState={exceptionsReady:true,loading:false,auxiliaryLoading:false};
 function render(){paints++;$('#viewRoot').innerHTML='<h3>FR8 · '+rows+' เคส (ข้อมูลจำลอง)</h3><p>อัปเดตอัตโนมัติ · ตัวกรองเดิม · ไม่ส่งคำขอ</p>';}
 const auto=new Function('state','Sb','$','liveOverviewState','render','renderNav','renderAuditFlow','loadLiveOverview','CaseClosure','ManualPairing','CrossDayWorkbench',src.slice(src.indexOf('let liveQueueUpdatePending'),src.indexOf('function offerLiveOverviewUpdate()'))+';return {applyLiveQueueUpdate};')(state,Sb,$,liveOverviewState,render,()=>{},()=>{},async()=>{},{},{},{});
 render();
 $('#slow').onclick=async()=>{transient=true;await entry();$('#proof').textContent='PASS: หน้างานเดิมยังอยู่ / ช่องร่างเดิมยังอยู่ / หยุดการกดบันทึกระหว่างตรวจสิทธิ์ / ไม่ออกจากระบบ';};
 $('#recover').onclick=async()=>{transient=false;await entry();$('#proof').textContent='PASS: ตรวจสิทธิ์กลับสำเร็จ / ไม่เตรียมข้อมูลใหม่ '+prepared+' ครั้ง / ไม่ทิ้งข้อความร่าง / กลับใช้หน้าทำงานเดิม';};
 $('#draft').onclick=()=>{$('#drawer').hidden=false;$('#responseText').value='ร่างตรวจสอบเดิม — ห้ามหายและยังไม่ส่ง';const before=paints;rows=4;const applied=auto.applyLiveQueueUpdate();$('#proof').textContent='PASS: รับข้อมูลใหม่แล้ว แต่ไม่วาดทับเมื่อเปิดร่าง / applied='+applied+' / paints เดิม='+(before===paints);};
 $('#finish').onclick=()=>{const draft=$('#responseText').value;$('#drawer').hidden=true;auto.applyLiveQueueUpdate();$('#proof').textContent='PASS: รายการใหม่แสดงอัตโนมัติ / ตัวกรองเดิม / ร่างยังอยู่: '+draft;};
})();
</script></html>
