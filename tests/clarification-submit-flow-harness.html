<!doctype html><html lang="th"><meta charset="utf-8"><title>คำชี้แจง — ข้อมูลจำลอง ไม่ส่งเคสจริง</title><link rel="stylesheet" href="../styles.css"><style>body{background:#edf4fb;padding:24px;font-family:Kanit,sans-serif}main{max-width:1000px;margin:auto}.panel{padding:24px;margin:16px 0}textarea{width:100%}.case-selected-evidence{padding:20px;background:#e9f7ee;border:1px solid #b8d9c1;border-radius:12px}.clarification-request-text{white-space:pre-wrap}article{padding:14px;border-bottom:1px solid #ddd}button{margin:6px}</style>
<main><h1>ผู้ชี้แจง → Audit · ทดสอบด้วยข้อมูลจำลอง</h1><p role="status">ไม่เชื่อมฐานข้อมูล ไม่ส่งคำชี้แจงหรือปิดเคสจริง</p><section class="panel"><h2>1. เลือกไฟล์แนบ</h2><p>TEST_หลักฐานรายการข้ามวัน.docx</p><button id="pick">เลือกเอกสารนี้</button><div id="draft"></div></section><section class="panel"><h2>2. ต้องการชี้แจงเคสนี้ โดยสาเหตุ…</h2><label>สาเหตุ<textarea id="reason" rows="4"></textarea></label><button id="submit">ส่งคำชี้แจงพร้อมหลักฐาน (จำลอง)</button><p id="receipt" role="status"></p></section><section class="panel"><h2>3. สิ่งที่ Audit เห็น</h2><div id="answer">ยังไม่มีคำชี้แจงใหม่</div><div id="history"></div></section></main>
<script src="../clarification-flow.js"></script><script>
const file={id:'test-file',file_name:'TEST_หลักฐานรายการข้ามวัน.docx'},old={label:'ข้อความเลือกไฟล์เดิม',text:'ตัวอย่างเดิม: รายการข้ามวัน มีเอกสารประกอบตรวจแล้ว',actor_name:'ผู้ชี้แจง TEST',file_name:file.file_name},rows=[old];let draft=null;
const draw=()=>history.innerHTML=ClarificationFlow.historyMarkup(rows,()=> '13 ต.ค. 2026 เวลา 20:00 น. (ตัวอย่าง)');draw();
pick.onclick=()=>{draft=file;document.querySelector('#draft').innerHTML=ClarificationFlow.draftMarkup(file);reason.focus();};
submit.onclick=()=>{const text=reason.value.trim();if(!draft||text.length<10){receipt.textContent='เลือกไฟล์และกรอกสาเหตุอย่างน้อย 10 ตัวอักษร';return;}rows.push({label:'คำชี้แจงใหม่ (จำลอง)',text,actor_name:'ผู้ชี้แจง TEST',file_name:draft.file_name});answer.textContent='สาเหตุ: '+text+' · หลักฐาน: '+draft.file_name;receipt.textContent='ส่งในตัวอย่างจำลองแล้ว — รอ Audit ตรวจ ไม่ปิดเคส';draw();history.querySelector('details').open=true;};
</script></html>
