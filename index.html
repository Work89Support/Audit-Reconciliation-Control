<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audit AI Reconciliation</title>
    <meta name="description" content="ศูนย์ควบคุมงานออดิทตรวจบัญชีฝาก-ถอน จับคู่ STM กับ BO อัตโนมัติ" />
    <link rel="stylesheet" href="fonts/kanit.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#viewRoot">ข้ามไปเนื้อหาหลัก</a>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark">A</div>
          <div>
            <p>Audit AI</p>
            <span>Reconciliation Control</span>
          </div>
          <button class="nav-toggle" id="navToggle" aria-label="เปิด/ปิดเมนู" aria-expanded="false">☰</button>
        </div>

        <nav class="nav-list" id="navList" aria-label="เมนูหลัก"></nav>

        <div class="source-panel">
          <p>Data Sources</p>
          <span>Email กลาง (ไฟล์ประจำวัน)</span>
          <span>STM ธนาคาร / BO Export</span>
          <span>STM PM 3 บริษัท</span>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-title">
            <p class="eyebrow" id="crumb">งานประจำวัน</p>
            <h1 id="pageTitle">แดชบอร์ด</h1>
            <p class="top-summary" id="pageDesc"></p>
          </div>
          <div class="top-actions">
            <button class="bell" id="btnBell" aria-label="การแจ้งเตือน">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.2 2.2 0 0 0 2.2-2.2H9.8A2.2 2.2 0 0 0 12 22Zm7-5.3V11a7 7 0 0 0-5.2-6.77V3.5a1.8 1.8 0 1 0-3.6 0v.73A7 7 0 0 0 5 11v5.7L3.2 18.5v.9h17.6v-.9L19 16.7Z"/></svg>
              <b id="bellCount" hidden>0</b>
            </button>
            <label class="role-switch">
              <span>มุมมองสิทธิ์</span>
              <select id="roleSelect" aria-label="เลือก role ที่ต้องการทดสอบสิทธิ์"></select>
            </label>
            <button class="ghost-button" id="btnExport">Export</button>
            <div class="auto-status" id="autoStatus" title="ระบบกระทบยอดให้อัตโนมัติเมื่อไฟล์เข้าครบ">
              <i></i><span>อัตโนมัติ</span><b id="autoStatusText">รอไฟล์</b>
            </div>
          </div>
        </header>

        <section class="quick-controls" id="globalFilters" aria-label="ตัวกรองหลัก"></section>

        <div id="viewRoot" class="view-root" tabindex="-1"></div>
      </main>
    </div>

    <div class="drawer-overlay" id="drawerOverlay" hidden></div>
    <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden></aside>
    <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

    <div class="modal-overlay" id="modalOverlay" hidden></div>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden></div>

    <div class="progress-overlay" id="progressOverlay" hidden>
      <div class="progress-card">
        <h2 id="progTitle">กำลังประมวลผล</h2>
        <p id="progLabel">เตรียมข้อมูล...</p>
        <div class="progress-bar"><i id="progFill"></i></div>
        <span id="progPct">0%</span>
      </div>
    </div>

    <!--
      หมายเหตุความปลอดภัย/ออฟไลน์:
      เดิมโหลด SheetJS (xlsx) และ html2canvas จาก cdnjs — ตัดออกแล้ว เพราะ
        • อ่าน/เขียน Excel ใช้ XlsxReader/XlsxWriter ที่เขียนเอง(ด้านล่าง) ทำงานออฟไลน์ได้เต็มรูปแบบ
        • จับภาพรายงานใช้ตัวจับภาพในตัว (SVG foreignObject) ใน export.js เป็น fallback อยู่แล้ว
      ผลลัพธ์: ไม่มี dependency ภายนอกตอนรัน = ไม่เสี่ยง supply-chain และใช้งานได้แม้ไม่มีเน็ต
      ถ้าต้องการ SheetJS/html2canvas เต็มรูปแบบในอนาคต ให้ดาวน์โหลดมาไว้ใน vendor/ พร้อมใส่ integrity (SRI)
      แล้วค่อยเพิ่ม <script src="vendor/..."> — อย่าอ้างอิง CDN ตรงๆ โดยไม่มี SRI
    -->
    <script src="xlsx-reader.js"></script>
    <script src="formats.js"></script>
    <script src="pdf-stm.js"></script>
    <script src="rules.js"></script>
    <script src="data.js"></script>
    <script src="registry.js"></script>
    <script src="sample.js"></script>
    <script src="engine.js"></script>
    <script src="store.js"></script>
    <script src="supabase.js?v=worker-recovery-20260818"></script>
    <script src="gmail.js"></script>
    <script src="charts.js"></script>
    <script src="xlsx-writer.js"></script>
    <script src="export.js"></script>
    <script src="docs.js"></script>
    <script src="app.js?v=worker-recovery-20260818"></script>
    <script src="manual.js"></script>
  </body>
</html>
