<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Audit worker code</title>
<pre id="code">Loading…</pre>
<script>
fetch("../n8n/audit-headless-worker.json")
  .then((response) => response.json())
  .then((workflow) => {
    const requested = new URLSearchParams(location.search).get("node");
    const nodeName = requested === "parser"
      ? "แปลงรายการเป็นมาตรฐาน"
      : "กระทบยอดและสร้าง Exception";
    const node = workflow.nodes.find((item) => item.name === nodeName);
    if (!node?.parameters?.jsCode) throw new Error("Worker code node not found");
    document.getElementById("code").textContent = node.parameters.jsCode;
  })
  .catch((error) => {
    document.getElementById("code").textContent = "ERROR: " + error.message;
  });
</script>
</html>
